services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-split}
      POSTGRES_USER: ${POSTGRES_USER:-split}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-split}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - split-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-split} -d ${POSTGRES_DB:-split}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: "postgres://${POSTGRES_USER:-split}:${POSTGRES_PASSWORD:-split}@postgres:5432/${POSTGRES_DB:-split}?sslmode=disable"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  split-postgres-data:
